<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bincom Election Results{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'election:polling_unit_result' %}">Bincom Election Results</a>
        <div class="navbar-nav ms-auto flex-row gap-3">
            <a class="nav-link" href="{% url 'election:polling_unit_result' %}">Q1: Polling Unit</a>
            <a class="nav-link" href="{% url 'election:lga_summed_result' %}">Q2: LGA Totals</a>
            <a class="nav-link" href="{% url 'election:add_polling_unit' %}">Q3: Add Polling Unit</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
